name: Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: my-cloud-run-app-478713

      # Step 3: Build and push Docker image to Artifact Registry
      - name: Build and push Docker image
        run: |
          IMAGE="asia-south1-docker.pkg.dev/my-cloud-run-app-478713/my-repo/myapp:${GITHUB_SHA}"
          # Create repo if it doesn't exist
          gcloud artifacts repositories create my-repo --repository-format=docker --location=asia-south1 || true
          docker build -t $IMAGE .
          docker push $IMAGE

      # Step 4: Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy myapp \
            --image $IMAGE \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated
