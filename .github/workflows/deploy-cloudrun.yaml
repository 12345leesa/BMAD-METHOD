name: Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout main repo
      - name: Checkout main repo
        uses: actions/checkout@v4

      # Step 2: Checkout BMAD Bundles repo
      - name: Checkout BMAD Bundles
        uses: actions/checkout@v4
        with:
          repository: bmad-code-org/bmad-bundles
          path: bmad-bundles
          token: ${{ secrets.BMAD_BUNDLES_TOKEN }}

      # Step 3: Authenticate to GCP
      - name: Authenticate GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Step 4: Build and push Docker image
      - name: Build and push Docker image
        run: |
             IMAGE="asia-south1-docker.pkg.dev/task05-478717/bmad-repo/bmad-agent:${GITHUB_SHA}"
             gcloud artifacts repositories create bmad-repo --repository-format=docker --location asia-south1 || true
             gcloud auth configure-docker asia-south1-docker.pkg.dev
             docker build -t $IMAGE .
             docker push $IMAGE



      # Step 5: Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy bmad-agent \
            --image $IMAGE \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated
